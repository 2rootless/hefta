# Bau der Mieter-App für iPhone und Android (docs/18-plan-native-app.md, Aufgabe 58).
#
# - „pruefen“ läuft bei jedem Push auf main und auf app/**: baut Web, iOS (Simulator, ohne Signatur) und
#   Android (Debug). Braucht keine geheimen Werte.
# - „testflight“ läuft nur von Hand (Actions → App → Run workflow, Haken „Zu TestFlight hochladen“), von main
#   oder app/hefta-2, und nur
#   in der geschützten Umgebung „store“: Jeder Lauf wartet auf die Freigabe des Auftraggebers.
#   Geheime Werte der Umgebung: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (Inhalt der .p8-Datei), APPLE_TEAM_ID.
# - „play“ läuft nur von Hand (Haken „AAB für Google Play bauen“), ebenfalls in „store“ (E64): baut ein
#   signiertes Android App Bundle und legt es als Datei am Lauf ab. Hochladen in die Play Console von Hand.
#   Geheime Werte: ANDROID_UPLOAD_KEYSTORE (Keystore als Base64), ANDROID_UPLOAD_PASSWORT, ANDROID_UPLOAD_ALIAS.
# - Läufe aus Forks bekommen nie geheime Werte (GitHub), und pull_request startet hier nichts.
name: App

on:
  push:
    branches: [main, 'app/**']
    paths:
      [
        'src/**',
        'ios/**',
        'android/**',
        'capacitor.config.ts',
        'package*.json',
        '.github/workflows/app.yml',
      ]
  workflow_dispatch:
    inputs:
      testflight:
        description: Zu TestFlight hochladen
        type: boolean
        default: false
      probe:
        description: Mit der Teilen-Probe (nur für Tests, nie für den Store)
        type: boolean
        default: false
      play:
        description: AAB für Google Play bauen
        type: boolean
        default: false

permissions:
  contents: read

# Mit pipefail: Scheitert xcodebuild, scheitert der Schritt, auch wenn danach `tail` läuft.
defaults:
  run:
    shell: bash

# Ein neuer Push bricht nur ältere Prüfläufe ab, nie einen von Hand gestarteten Lauf (TestFlight, Play).
concurrency:
  group: app-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  pruefen-ios:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      - name: Xcode 26 wählen (App Store Connect verlangt das iOS-26-SDK)
        run: |
          ls -d /Applications/Xcode*.app
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)
          test -n "$X" || { echo "Kein Xcode 26 auf diesem Runner"; exit 1; }
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version
      - name: Bauen für den Simulator, ohne Signatur
        run: >
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build | tail -n 40

  pruefen-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Debug-Bau
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

  testflight:
    # Auch vom Zweig app/hefta-2 (E79): Testversion nur intern (E62), eingereicht wird nur von main.
    if: github.event_name == 'workflow_dispatch' && inputs.testflight && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/app/hefta-2')
    needs: pruefen-ios
    runs-on: macos-15-intel
    timeout-minutes: 45
    environment: store
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      - name: Xcode 26 wählen (App Store Connect verlangt das iOS-26-SDK)
        run: |
          ls -d /Applications/Xcode*.app
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)
          test -n "$X" || { echo "Kein Xcode 26 auf diesem Runner"; exit 1; }
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version
      - name: Schlüssel nur für diesen Lauf ablegen
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"
      - name: Teilen-Probe herausnehmen
        if: ${{ !inputs.probe }}
        run: node scripts/ohne-probe.mjs
      # Ohne Signatur archivieren: Automatisch signiert verlangt Xcode sonst ein Entwicklungsprofil und
      # dafür ein registriertes Gerät (Lauf vom 7.11.). Signiert wird beim Export, über den API-Schlüssel.
      - name: Archiv bauen, noch ohne Signatur
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: >
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release
          -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Hefta.xcarchive"
          DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          CURRENT_PROJECT_VERSION="${{ github.run_number }}"
          archive | tail -n 40
      - name: Zu App Store Connect hochladen (TestFlight)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Hefta.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tail -n 40
      - name: Schlüssel wieder löschen
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"

  play:
    if: github.event_name == 'workflow_dispatch' && inputs.play && github.ref == 'refs/heads/main'
    needs: pruefen-android
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: store
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Upload-Schlüssel nur für diesen Lauf ablegen
        env:
          ANDROID_UPLOAD_KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
        run: |
          mkdir -p "$RUNNER_TEMP/play"
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE" | base64 -d > "$RUNNER_TEMP/play/upload.jks"
          chmod 600 "$RUNNER_TEMP/play/upload.jks"
      - name: AAB bauen und signieren
        working-directory: android
        env:
          HEFTA_UPLOAD_KEYSTORE: ${{ runner.temp }}/play/upload.jks
          HEFTA_UPLOAD_PASSWORT: ${{ secrets.ANDROID_UPLOAD_PASSWORT }}
          HEFTA_UPLOAD_ALIAS: ${{ secrets.ANDROID_UPLOAD_ALIAS }}
          HEFTA_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew --no-daemon bundleRelease
      - name: Schlüssel wieder löschen
        if: always()
        run: rm -rf "$RUNNER_TEMP/play"
      - uses: actions/upload-artifact@v4
        with:
          name: hefta-android-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
